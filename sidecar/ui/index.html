<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAPeR</title>
<style>
  :root {
    --bg:#0f0f10; --head:#161618; --line:#26262b; --text:#ececf0; --dim:#8a8a92;
    --accent:#e0a92e; --user:#2a2a30; --ans:#1b1b1f; --flash:rgba(224,169,46,.22);
    --done:#4ad07a; --danger:#e0574a;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    /* the window chrome isn't selectable, but content is (see #chat) */
    -webkit-user-select:none; user-select:none;
  }
  header {
    flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
    gap:8px; padding:8px 12px; background:var(--head);
    border-bottom:1px solid var(--line); -webkit-app-region:drag;
  }
  header .stats { color:var(--dim); font-size:12px; }
  header .stats b { color:var(--text); }
  header .right { display:flex; align-items:center; gap:6px; }
  .btn { -webkit-app-region:no-drag; cursor:pointer; background:transparent;
         border:1px solid var(--line); color:var(--dim); border-radius:7px;
         width:28px; height:26px; display:inline-flex; align-items:center;
         justify-content:center; padding:0; transition:all .12s ease; }
  .btn:hover { color:var(--text); border-color:#3a3a42; background:#1e1e22; }
  .btn svg { width:15px; height:15px; display:block; }
  .btn.on { color:var(--accent); border-color:var(--accent);
            background:rgba(224,169,46,.10); }
  .btn.danger { color:var(--danger); border-color:var(--danger);
                background:rgba(224,87,74,.10); }
  body.compact header .stats { display:none; }

  /* Claude-responded banner: blinks briefly to catch the eye, then holds
     steady until acknowledged (click / focus / next prompt). */
  #done { display:none; flex:0 0 auto; cursor:pointer; -webkit-app-region:no-drag;
          padding:9px 12px; background:rgba(74,208,122,.14); color:var(--done);
          border-bottom:1px solid rgba(74,208,122,.35); font-weight:600;
          font-size:13px; }
  #done.show { display:block; }
  #done.blinking { animation:blink 1s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.4;} }

  /* Paused strip */
  #paused { display:none; flex:0 0 auto; padding:8px 12px; font-size:12px;
            color:var(--danger); background:rgba(224,87,74,.10);
            border-bottom:1px solid rgba(224,87,74,.3); }
  body.paused #paused { display:block; }
  body.paused #chat { opacity:.5; }

  #chat { flex:1 1 auto; overflow-y:auto; padding:14px; display:flex;
          flex-direction:column; gap:14px;
          -webkit-user-select:text; user-select:text; cursor:auto; }
  #chat::-webkit-scrollbar { width:10px; }
  #chat::-webkit-scrollbar-track { background:transparent; }
  #chat::-webkit-scrollbar-thumb { background:#33333b; border-radius:6px;
          border:2px solid var(--bg); }
  #chat::-webkit-scrollbar-thumb:hover { background:#45454f; }
  .empty { margin:auto; color:var(--dim); text-align:center; max-width:240px;
           line-height:1.6; }
  .exchange { display:flex; flex-direction:column; gap:6px; }
  .q { align-self:flex-end; max-width:88%; background:var(--user); color:var(--text);
       padding:8px 12px; border-radius:14px 14px 4px 14px; }
  .a { align-self:flex-start; max-width:92%; background:var(--ans);
       border:1px solid var(--line); padding:11px 14px;
       border-radius:14px 14px 14px 4px; }
  .a p { margin:0 0 7px; line-height:1.5; }
  .a p:last-of-type { margin-bottom:0; }
  .a p.lead { color:#fff; }                 /* the takeaway line stands out */
  .a ul.pts { margin:8px 0 0; padding-left:16px; }
  .a li { margin:3px 0; line-height:1.45; }
  .a.flash { animation:flash 1.2s ease-out; }
  @keyframes flash { from{background:var(--flash);} to{background:var(--ans);} }
  .meta { color:var(--dim); font-size:11px; margin-top:6px; }
</style>
</head>
<body>
  <header>
    <span class="stats" id="stats">—</span>
    <div class="right">
      <button id="power" class="btn" title="PAPeR is on — click to pause">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5v8"/><path d="M6.6 6.6a7.5 7.5 0 1 0 10.8 0"/></svg>
      </button>
      <button id="opacity" class="btn" title="Opacity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="size" class="btn" title="Expand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4H4v5"/><path d="M15 20h5v-5"/>
          <path d="M4 4l6 6"/><path d="M20 20l-6-6"/></svg>
      </button>
      <button id="pin" class="btn on" title="Pinned on top — click to unpin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 3.5h5l-.8 5.2 2.8 2.3v1.5H7.5v-1.5l2.8-2.3-.8-5.2z"/>
          <path d="M12 12.8V20.5"/></svg>
      </button>
    </div>
  </header>

  <div id="done" title="Dismiss">● Claude has responded</div>
  <div id="paused">PAPeR is paused — every prompt goes to Claude untouched.</div>

  <div id="chat">
    <div class="empty" id="empty">
      Non-code questions you ask in Claude Code get answered here, off-quota —
      zero Claude quota spent.
    </div>
  </div>

<script>
const $ = (id)=>document.getElementById(id);
let maxId = 0;
let firstLoad = true;

function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function money(n){ if(!n) return "$0.00"; return "$"+Number(n).toFixed(n<0.01?4:2); }

// Turn the plain-text answer into readable blocks: the first line is the
// takeaway, "- " lines become a bullet list, blank lines separate paragraphs.
function renderAnswer(text){
  const lines=(text||"").split("\n");
  let html="", inList=false, isFirst=true;
  const closeList=()=>{ if(inList){ html+="</ul>"; inList=false; } };
  for(const raw of lines){
    const ln=raw.trim();
    if(!ln){ closeList(); continue; }
    if(/^-\s+/.test(ln)){
      if(!inList){ html+='<ul class="pts">'; inList=true; }
      html+="<li>"+esc(ln.replace(/^-\s+/,""))+"</li>";
    } else {
      closeList();
      html+='<p'+(isFirst?' class="lead"':'')+'>'+esc(ln)+"</p>";
    }
    isFirst=false;
  }
  closeList();
  return html || "<p>"+esc(text)+"</p>";
}

function makeExchange(d, flash){
  const tok=(d.input_tokens||0)+(d.output_tokens||0);
  const div=document.createElement("div");
  div.className="exchange";
  div.innerHTML=
    `<div class="q">${esc(d.question)}</div>`+
    `<div class="a${flash?' flash':''}">${renderAnswer(d.answer)}`+
      `<div class="meta">${esc(d.model||d.provider||'')} · `+
      `${money(d.cost_usd)} · ${tok} tok · 0 Claude quota</div>`+
    `</div>`;
  return div;
}

// ---- Claude-responded banner state (server-driven) ----
let lastSeq = 0;          // most recent claude_done_seq we've seen
let dismissedSeq = -1;    // local: highest seq the user has acknowledged here
let doneTimer = null;

function showDone(){
  const el=$("done");
  el.classList.add("show","blinking");
  if(doneTimer){ clearTimeout(doneTimer); }
  doneTimer=setTimeout(()=>el.classList.remove("blinking"), 4500); // steady after
}
function hideDone(){
  if(doneTimer){ clearTimeout(doneTimer); }
  $("done").classList.remove("show","blinking");
}
function dismissDone(){ dismissedSeq=lastSeq; hideDone(); }

function updateDone(seq, ack){
  if(firstLoad){ dismissedSeq=seq; }               // don't blink stale on open
  lastSeq=seq;
  const shouldShow = seq>0 && seq>ack && seq>dismissedSeq;
  const showing = $("done").classList.contains("show");
  if(shouldShow && !showing){ showDone(); }
  else if(!shouldShow){ hideDone(); }
}

function render(s){
  const p=s.provider||{}, c=s.counters||{};
  $("stats").innerHTML =
    `${esc(p.vendor||"")} · <b>${c.deflected_count||0}</b> deflected · <b>0</b> quota`;

  // deflections arrive newest-first from the API. Normal chat order:
  // append oldest-of-the-fresh first, so the newest ends up at the BOTTOM.
  const items=(s.deflections||[]);
  const fresh=items.filter(d=>(d.id!=null?d.id:0)>maxId);
  if(fresh.length){ $("empty").style.display="none"; }
  let last=null;
  fresh.slice().reverse().forEach(d=>{
    maxId=Math.max(maxId, d.id||0);
    last=makeExchange(d, !firstLoad);
    $("chat").appendChild(last);
  });
  if(last && !firstLoad){ last.scrollIntoView({block:"start"}); }

  updateDone(s.claude_done_seq||0, s.claude_done_ack||0);
  reflectEnabled(s.enabled!==false);

  firstLoad=false;
}

async function poll(){
  try{ render(await (await fetch("/state")).json()); }catch(e){}
}
poll();
setInterval(poll,1200);

// Acknowledge the banner when the user engages with the window.
$("done").addEventListener("click", dismissDone);
window.addEventListener("focus", dismissDone);
document.addEventListener("mouseenter", dismissDone);

// ---- Enable / disable toggle ----
const powerBtn=$("power"); let enabled=true;
function reflectEnabled(on){
  enabled=on;
  document.body.classList.toggle("paused", !on);
  powerBtn.classList.toggle("danger", !on);
  powerBtn.title = on ? "PAPeR is on — click to pause"
                      : "PAPeR is paused — click to resume";
}
powerBtn.addEventListener("click", async ()=>{
  reflectEnabled(!enabled);                          // optimistic
  try{
    const r=await (await fetch("/toggle",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({enabled})})).json();
    if(r && typeof r.enabled==="boolean"){ reflectEnabled(r.enabled); }
  }catch(e){ /* keep optimistic state; next poll reconciles */ }
});

// ---- Pin toggle ----
const pinBtn=$("pin"); let pinned=true;
function reflectPin(){ pinBtn.classList.toggle("on",pinned);
  pinBtn.title=pinned?"Pinned on top — click to unpin":"Click to keep on top"; }
pinBtn.addEventListener("click", async ()=>{
  try{ pinned = (window.pywebview?.api?.toggle_pin) ? await window.pywebview.api.toggle_pin() : !pinned; }
  catch(e){ pinned=!pinned; }
  reflectPin();
});
reflectPin();

// ---- Expand / collapse ----
const sizeBtn=$("size"); let compact=true;
function reflectSize(){ document.body.classList.toggle("compact",compact);
  sizeBtn.title=compact?"Expand":"Collapse"; }
sizeBtn.addEventListener("click", async ()=>{
  try{ compact = (window.pywebview?.api?.toggle_size) ? await window.pywebview.api.toggle_size() : !compact; }
  catch(e){ compact=!compact; }
  reflectSize();
});
reflectSize();

// ---- Opacity: 3 levels — Normal, Medium, Near-transparent ----
const opBtn=$("opacity");
const LEVELS=[{v:1.0,label:"Normal"},{v:0.55,label:"Medium"},{v:0.35,label:"Near-transparent"}];
let opi=0;
opBtn.addEventListener("click", async ()=>{
  opi=(opi+1)%LEVELS.length; const {v,label}=LEVELS[opi];
  opBtn.classList.toggle("on", v<1.0);
  opBtn.title=`Opacity: ${label}`;
  try{ if(window.pywebview?.api?.set_opacity){ await window.pywebview.api.set_opacity(v); }
       else { document.body.style.opacity=v; } }
  catch(e){ document.body.style.opacity=v; }
});
</script>
</body>
</html>
