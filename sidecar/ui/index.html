<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAPeR</title>
<style>
  :root {
    --bg:#0f0f10; --head:#161618; --line:#26262b; --text:#ececf0; --dim:#8a8a92;
    --accent:#e0a92e; --user:#2a2a30; --ans:#1b1b1f; --flash:rgba(224,169,46,.22);
    --done:#4ad07a;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  header {
    flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
    gap:8px; padding:8px 12px; background:var(--head);
    border-bottom:1px solid var(--line); -webkit-app-region:drag;
  }
  header .stats { color:var(--dim); font-size:12px; }
  header .stats b { color:var(--text); }
  header .right { display:flex; align-items:center; gap:8px; }
  .btn { -webkit-app-region:no-drag; cursor:pointer; background:transparent;
         border:1px solid var(--line); color:var(--dim); border-radius:6px;
         padding:3px 8px; font-size:12px; line-height:1; }
  .btn.on { color:var(--accent); border-color:var(--accent); }
  body.compact header .stats { display:none; }

  /* Claude-responded banner */
  #done { display:none; flex:0 0 auto; cursor:pointer; -webkit-app-region:no-drag;
          padding:9px 12px; background:rgba(74,208,122,.14); color:var(--done);
          border-bottom:1px solid rgba(74,208,122,.35); font-weight:600;
          font-size:13px; }
  #done.show { display:block; animation:blink 1s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.45;} }

  #chat { flex:1 1 auto; overflow-y:auto; padding:14px; display:flex;
          flex-direction:column; gap:14px; }
  #chat::-webkit-scrollbar { width:10px; }
  #chat::-webkit-scrollbar-track { background:transparent; }
  #chat::-webkit-scrollbar-thumb { background:#33333b; border-radius:6px;
          border:2px solid var(--bg); }
  #chat::-webkit-scrollbar-thumb:hover { background:#45454f; }
  .empty { margin:auto; color:var(--dim); text-align:center; max-width:240px;
           line-height:1.6; }
  .exchange { display:flex; flex-direction:column; gap:6px; }
  .q { align-self:flex-end; max-width:88%; background:var(--user); color:var(--text);
       padding:8px 12px; border-radius:14px 14px 4px 14px; }
  .a { align-self:flex-start; max-width:92%; background:var(--ans);
       border:1px solid var(--line); padding:11px 14px;
       border-radius:14px 14px 14px 4px; }
  .a p { margin:0 0 7px; line-height:1.5; }
  .a p:last-of-type { margin-bottom:0; }
  .a p.lead { color:#fff; }                 /* the takeaway line stands out */
  .a ul.pts { margin:8px 0 0; padding-left:16px; }
  .a li { margin:3px 0; line-height:1.45; }
  .a.flash { animation:flash 1.2s ease-out; }
  @keyframes flash { from{background:var(--flash);} to{background:var(--ans);} }
  .meta { color:var(--dim); font-size:11px; margin-top:6px; }
  .meta .off { color:var(--accent); }
</style>
</head>
<body>
  <header>
    <span class="stats" id="stats">—</span>
    <div class="right">
      <button id="opacity" class="btn" title="Dim the window">◐</button>
      <button id="size" class="btn" title="Expand">⤢</button>
      <button id="pin" class="btn on" title="Pinned on top — click to unpin">📌</button>
    </div>
  </header>

  <div id="done" title="Dismiss">● Claude has responded</div>

  <div id="chat">
    <div class="empty" id="empty">
      Non-code questions you ask in Claude Code get answered here, off-quota —
      zero Claude quota spent.
    </div>
  </div>

<script>
const $ = (id)=>document.getElementById(id);
let maxId = 0;
let firstLoad = true;
let doneSeq = null;

function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function money(n){ if(!n) return "$0.00"; return "$"+Number(n).toFixed(n<0.01?4:2); }

// Turn the plain-text answer into readable blocks: the first line is the
// takeaway, "- " lines become a bullet list, blank lines separate paragraphs.
function renderAnswer(text){
  const lines=(text||"").split("\n");
  let html="", inList=false, isFirst=true;
  const closeList=()=>{ if(inList){ html+="</ul>"; inList=false; } };
  for(const raw of lines){
    const ln=raw.trim();
    if(!ln){ closeList(); continue; }
    if(/^-\s+/.test(ln)){
      if(!inList){ html+='<ul class="pts">'; inList=true; }
      html+="<li>"+esc(ln.replace(/^-\s+/,""))+"</li>";
    } else {
      closeList();
      html+='<p'+(isFirst?' class="lead"':'')+'>'+esc(ln)+"</p>";
    }
    isFirst=false;
  }
  closeList();
  return html || "<p>"+esc(text)+"</p>";
}

function makeExchange(d, flash){
  const tok=(d.input_tokens||0)+(d.output_tokens||0);
  const div=document.createElement("div");
  div.className="exchange";
  div.innerHTML=
    `<div class="q">${esc(d.question)}</div>`+
    `<div class="a${flash?' flash':''}">${renderAnswer(d.answer)}`+
      `<div class="meta"><span class="off">off-quota</span> · `+
      `${esc(d.model||d.provider||'')} · ${money(d.cost_usd)} · ${tok} tok · 0 Claude quota</div>`+
    `</div>`;
  return div;
}

function render(s){
  const p=s.provider||{}, c=s.counters||{};
  $("stats").innerHTML =
    `${esc(p.vendor||"")} · <b>${c.deflected_count||0}</b> deflected · <b>0</b> quota`;

  // deflections arrive newest-first from the API. Normal chat order:
  // append oldest-of-the-fresh first, so the newest ends up at the BOTTOM.
  const items=(s.deflections||[]);
  const fresh=items.filter(d=>(d.id!=null?d.id:0)>maxId);
  if(fresh.length){ $("empty").style.display="none"; }
  let last=null;
  fresh.slice().reverse().forEach(d=>{
    maxId=Math.max(maxId, d.id||0);
    last=makeExchange(d, !firstLoad);
    $("chat").appendChild(last);
  });
  // Scroll so the newest exchange's TOP sits at the top of the viewport —
  // the user reads the new answer from its first line, not pinned to the bottom.
  if(last && !firstLoad){ last.scrollIntoView({block:"start"}); }

  // Claude-responded signal
  const seq=s.claude_done_seq||0;
  if(doneSeq===null){ doneSeq=seq; }             // don't blink on first load
  else if(seq>doneSeq){ doneSeq=seq; showDone(); }

  firstLoad=false;
}

async function poll(){
  try{ render(await (await fetch("/state")).json()); }catch(e){}
}
poll();
setInterval(poll,1200);

// Claude-responded banner: blink briefly to catch the eye, then auto-clear
// so it doesn't nag once you've noticed it. Click dismisses immediately.
let doneTimer=null;
function showDone(){
  const el=$("done"); el.classList.add("show");
  if(doneTimer){ clearTimeout(doneTimer); }
  doneTimer=setTimeout(()=>el.classList.remove("show"), 8000);
}
$("done").addEventListener("click",()=>{
  if(doneTimer){ clearTimeout(doneTimer); }
  $("done").classList.remove("show");
});

// Pin toggle
const pinBtn=$("pin"); let pinned=true;
function reflectPin(){ pinBtn.classList.toggle("on",pinned);
  pinBtn.title=pinned?"Pinned on top — click to unpin":"Click to keep on top"; }
pinBtn.addEventListener("click", async ()=>{
  try{ pinned = (window.pywebview?.api?.toggle_pin) ? await window.pywebview.api.toggle_pin() : !pinned; }
  catch(e){ pinned=!pinned; }
  reflectPin();
});
reflectPin();

// Expand / collapse
const sizeBtn=$("size"); let compact=true;
function reflectSize(){ document.body.classList.toggle("compact",compact);
  sizeBtn.textContent=compact?"⤢":"⤡"; sizeBtn.title=compact?"Expand":"Collapse"; }
sizeBtn.addEventListener("click", async ()=>{
  try{ compact = (window.pywebview?.api?.toggle_size) ? await window.pywebview.api.toggle_size() : !compact; }
  catch(e){ compact=!compact; }
  reflectSize();
});
reflectSize();

// Opacity cycle: 100% -> 80% -> 55% -> 35% -> 100%
const opBtn=$("opacity"); const LEVELS=[1.0,0.8,0.55,0.35]; let opi=0;
opBtn.addEventListener("click", async ()=>{
  opi=(opi+1)%LEVELS.length; const v=LEVELS[opi];
  opBtn.classList.toggle("on", v<1.0);
  opBtn.title=`Opacity ${Math.round(v*100)}%`;
  try{ if(window.pywebview?.api?.set_opacity){ await window.pywebview.api.set_opacity(v); }
       else { document.body.style.opacity=v; } }
  catch(e){ document.body.style.opacity=v; }
});
</script>
</body>
</html>
